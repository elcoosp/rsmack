[workspace]
members = [
    "packages/rsmack-wrap",
    "packages/rsmack-edoc",
    "packages/rsmack-utils",
    "packages/rsmack-seanum",
    "packages/rsmack-fs",
    "packages/rsmack-megamac",
    "packages/rsmack-example-macros",
]
resolver = "3"

[workspace.package]
version = "0.19.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/elcoosp/rsmack"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
wildcard_imports = "allow"
must_use_candidate = "allow"
# `exec(parsed_args, env)` receives owned values by design (the generated macros
# forward the output of `syn::parse_macro_input!`), consuming them lazily.
needless_pass_by_value = "allow"

[workspace.dependencies]
# External
bon = "3.10.3"
build-print = "1.0.1"
darling = "0.24.1"
fake = { version = "5.1.0", features = ["derive"] }
proc-macro2 = "1.0.107"
quote = "1.0.47"
sea-orm = { version = "2.0.4", features = ["macros"] }
sea-orm-migration = "2.0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
schemars = "1.2.3"
stringcase = "1.0.0"
strum = { version = "0.28.0", features = ["derive"] }
syn = { version = "3.0.9", features = ["full"] }
# Internal
rsmack-utils = { version = "0.19.0", path = "packages/rsmack-utils" }
rsmack-megamac = { version = "0.19.0", path = "packages/rsmack-megamac" }
