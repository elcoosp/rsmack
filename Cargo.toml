[workspace]
exclude = ["fuzz"]
members = [
    "packages/rsmack",
    "packages/rsmack-wrap",
    "packages/rsmack-edoc",
    "packages/rsmack-utils",
    "packages/rsmack-seanum",
    "packages/rsmack-fs",
    "packages/rsmack-megamac",
    "packages/rsmack-example-macros",
    "packages/rsmack-ui-tests",
]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
# Honest MSRV: `sea-orm 2.0` (the heaviest dependency) requires 1.94.
rust-version = "1.94"
repository = "https://github.com/elcoosp/rsmack"

[workspace.lints.clippy]
# Pedantic is denied workspace-wide, with **no allows**: every pedantic finding
# is fixed at the call site instead of silenced.
pedantic = { level = "deny", priority = -1 }

[workspace.dependencies]
# External
bon = "3.10.3"
build-print = "1.0.1"
criterion = "0.8.2"
darling = "0.24.1"
fake = { version = "5.1.0", features = ["derive"] }
proc-macro2 = "1.0.107"
quote = "1.0.47"
sea-orm = { version = "2.0.4", features = ["macros"] }
sea-orm-migration = "2.0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
schemars = "1.2.3"
stringcase = "1.0.0"
strum = { version = "0.28.0", features = ["derive"] }
# `full` is feature-gated per crate: only crates that parse full items (structs,
# enums, files) opt in. Everything else compiles with the lighter default set.
syn = { version = "3.0.9", default-features = false, features = [
    "derive",
    "parsing",
    "printing",
    "clone-impls",
    "proc-macro",
] }
trybuild = "1.0.122"
# Internal
rsmack = { version = "1.0.0", path = "packages/rsmack" }
rsmack-utils = { version = "1.0.0", path = "packages/rsmack-utils" }
rsmack-megamac = { version = "1.0.0", path = "packages/rsmack-megamac" }
rsmack-edoc = { version = "1.0.0", path = "packages/rsmack-edoc" }
rsmack-wrap = { version = "1.0.0", path = "packages/rsmack-wrap" }
rsmack-seanum = { version = "1.0.0", path = "packages/rsmack-seanum" }
rsmack-fs = { version = "1.0.0", path = "packages/rsmack-fs" }
rsmack-example-macros = { version = "1.0.0", path = "packages/rsmack-example-macros" }
