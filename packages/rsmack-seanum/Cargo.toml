[package]
documentation = "https://rsmack.vercel.app"

readme = "../../README.md"
name = "rsmack-seanum"
keywords = ["macro", "lisp", "metaprogramming", "codegen", "proc-macro"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "SeaORM enum attribute macro with sane defaults"

[lib]
proc-macro = true

[dependencies]
darling.workspace = true
proc-macro2.workspace = true
quote.workspace = true
rsmack-megamac.workspace = true
rsmack-utils.workspace = true
sea-orm.workspace = true
serde.workspace = true
stringcase.workspace = true
syn = { workspace = true, features = ["full"] }

[dev-dependencies]
criterion.workspace = true
fake.workspace = true
sea-orm-migration.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[[bench]]
name = "expansion"
harness = false

# docs.rs builds with every feature enabled so the docs show the full API.
[package.metadata.docs.rs]
all-features = true
