[package]
documentation = "https://rsmack.vercel.app"

readme = "../../README.md"
name = "rsmack-megamac"
keywords = ["macro", "lisp", "metaprogramming", "codegen", "proc-macro"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Procedural macro generator with automatic documentation and error handling"

[lib]
proc-macro = true

[dependencies]
bon.workspace = true
darling.workspace = true
proc-macro2.workspace = true
quote.workspace = true
rsmack-utils.workspace = true
stringcase.workspace = true
strum.workspace = true
syn = { workspace = true, features = ["full"] }

[lints]
workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "expansion"
harness = false

# docs.rs builds with every feature enabled so the docs show the full API.
[package.metadata.docs.rs]
all-features = true
