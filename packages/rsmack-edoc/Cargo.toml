[package]
documentation = "https://rsmack.vercel.app"

readme = "../../README.md"
name = "rsmack-edoc"
keywords = ["macro", "doc", "lisp", "metaprogramming", "codegen"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Enhanced documentation macro with constant evaluation"

[lib]
proc-macro = true

[dependencies]
darling.workspace = true
proc-macro2.workspace = true
quote.workspace = true
rsmack-megamac.workspace = true
rsmack-utils.workspace = true
syn = { workspace = true, features = ["full", "visit"] }

[lints]
workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "expansion"
harness = false

# docs.rs builds with every feature enabled so the docs show the full API.
[package.metadata.docs.rs]
all-features = true
