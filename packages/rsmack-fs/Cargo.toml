[package]
name = "rsmack-fs"
keywords = ["macro", "fs", "lisp", "metaprogramming", "codegen"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Compile-time folder structure mirroring"

[lib]
proc-macro = true

[dependencies]
darling.workspace = true
proc-macro2.workspace = true
quote.workspace = true
rsmack-megamac.workspace = true
rsmack-utils.workspace = true
syn = { workspace = true, features = ["full"] }

[lints]
workspace = true

# docs.rs builds with every feature enabled so the docs show the full API.
[package.metadata.docs.rs]
all-features = true
