[package]
name = "rsmack-wrap"
keywords = ["macro", "lisp", "metaprogramming", "codegen", "proc-macro"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Struct field type wrapper"

[lib]
proc-macro = true

[dependencies]
darling.workspace = true
proc-macro2.workspace = true
quote.workspace = true
rsmack-megamac.workspace = true
rsmack-utils.workspace = true
syn = { workspace = true, features = ["full", "extra-traits"] }

[lints]
workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "expansion"
harness = false

# docs.rs builds with every feature enabled so the docs show the full API.
[package.metadata.docs.rs]
all-features = true
