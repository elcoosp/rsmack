name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (pedantic denied via workspace lints)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  changelog:
    name: Generate changelog with git-cliff
    runs-on: ubuntu-latest
    needs: [validate]
    outputs:
      release_body: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # git-cliff needs the tags to compute the changelog
          fetch-tags: true

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate the latest release notes
        id: cliff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git-cliff --latest --strip header --unreleased > release-notes.md
          cat release-notes.md
          {
            echo 'content<<EOF'
            cat release-notes.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Update the full CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git-cliff --output CHANGELOG.md

      - name: Upload changelog artifacts
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: |
            CHANGELOG.md
            release-notes.md

  publish:
    name: Publish crates to crates.io
    runs-on: ubuntu-latest
    needs: [validate]
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Publish all workspace crates (order-aware)
        uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          dry-run: false
          ignore-published: true
          publish-delay: 30000

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [changelog, publish]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download changelog artifacts
        uses: actions/download-artifact@v4
        with:
          name: changelog

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: ${{ needs.changelog.outputs.release_body }}
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
