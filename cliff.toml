# Configuration for git-cliff (https://git-cliff.org)
# Generates CHANGELOG.md and release notes from Conventional Commits.

[changelog]
# A new line template for the changelog header.
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
# Template for the changelog body (git-cliff default template, github flavoured).
body = """
{% macro remote_url() %}\
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
{% endmacro %}\
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
    ### {{ entry.group | striptags | trim | upper_first }}
    {% for commit in entry.commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
            {% if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }}) {% endif %}
    {% endfor %}
{% endfor %}
"""

# Template for the changelog footer.
footer = """
<!-- generated by git-cliff -->
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true
# An array of regex based postprocessors to modify the changelog.
postprocessors = [
  { pattern = '\{remote_url\}', replace = "{remote_url}" },
]

[git]
# Parse commits according to Conventional Commits.
conventional_commits = true
# Exclude commits that do not match the conventional commits spec.
filter_unconventional = true
# Split commits on newlines.
split_commits = false
# An array of regex based parsers to modify commit messages.
commit_preprocessors = [
  # Remove trailing whitespace.
  { pattern = ' +$', replace = "" },
]
# An array of regex based parsers for extracting structured data from commit messages.
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^doc", group = "Documentation" },
  { message = "^refactor", group = "Refactor" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Testing" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^chore|^ci", group = "Miscellaneous Tasks" },
  { body = ".*security", group = "Security" },
  { message = "^revert", group = "Revert" },
]
# Protect breaking changes from being skipped.
protect_breaking_commits = true
# Filter out commits that do not match a parser.
filter_commits = false
# Regex for matching git tags.
tag_pattern = "v[0-9].*"
# Regex for skipping tags.
skip_tags = "v0.1.0-beta.1"
# Regex for ignoring tags.
ignore_tags = ""
# Sort the tags topologically.
topo_order = false
# Sort the commits inside sections by oldest/newest order.
sort_commits = "oldest"

[remote.github]
owner = "elcoosp"
repo = "rsmack"
